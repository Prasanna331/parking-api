version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: parking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: PP$1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: parking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  parking-api-java:
    build:
      context: ./parking-api-java
      dockerfile: Dockerfile
    container_name: parking_api_java
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parking_db
      SPRING_DATASOURCE_USERNAME: parking_user
      SPRING_DATASOURCE_PASSWORD: PP$1234
      APP_JWT_SECRET: cGFya2luZy1hcGktand0LXNlY3JldC1rZXktZm9yLWhzMjU2LWFsZ29yaXRobS0yMDI0
      APP_JWT_EXPIRATION_MS: 604800000
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      - postgres

  parking-ui:
    build:
      context: ./parking-ui
      dockerfile: Dockerfile
    container_name: parking_ui
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - parking-api-java

volumes:
  postgres_data:
