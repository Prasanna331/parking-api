# Server
server.port=8080
spring.application.name=parking-api

# PostgreSQL (override with SPRING_DATASOURCE_URL env var when running in Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/parking_db
spring.datasource.username=parking_user
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — must be Base64-encoded string of at least 32 characters
# Value below = Base64("parking-api-jwt-secret-key-for-hs256-algorithm-2024")
app.jwt.secret=cGFya2luZy1hcGktand0LXNlY3JldC1rZXktZm9yLWhzMjU2LWFsZ29yaXRobS0yMDI0
app.jwt.expiration-ms=604800000

# Logging
logging.level.com.parking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
